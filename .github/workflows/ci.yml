name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # Reviewers: this is the exact, canonical validation sequence. The first
      # step uses --frozen-lockfile so the committed bun.lockb is verified byte
      # for byte and never rewritten; it is a read-only integrity check.
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: bun run format:check
